version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: book_review_db
    restart: always
    environment:
      POSTGRES_DB: book_review_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
